name: Build Cobre Server para Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Testar API e autenticação
        run: npm test
      - name: Auditar dependências
        run: npm audit --audit-level=moderate
      - name: Criar aplicativo e pacote Windows
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'cobre-server-dist.log'
          npm run dist:win 2>&1 | Tee-Object -FilePath $logPath
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $message = (Get-Content -LiteralPath $logPath -Tail 35) -join "`n"
            $message = $message -replace [regex]::Escape($env:GITHUB_WORKSPACE), '<workspace>'
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Packaging log tail::$message"
            exit $buildExit
          }
      - name: Gerar checksums SHA-256
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip', '.exe' } | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content release/checksums-sha256.txt
      - name: Disponibilizar ZIP portátil e instalador
        uses: actions/upload-artifact@v4
        with:
          name: Cobre-Server-Windows-x64
          path: |
            release/Cobre-Server-*-Windows-x64.zip
            release/Cobre-Server-*-Windows-x64.exe
            release/checksums-sha256.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Baixar changelog da versão marcada
        uses: actions/checkout@v4
      - name: Baixar pacote verificado
        uses: actions/download-artifact@v4
        with:
          name: Cobre-Server-Windows-x64
          path: release
      - name: Preparar notas desta versão
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          changelog = open('CHANGELOG.md', encoding='utf-8').read()
          match = re.search(r'^##\s+' + re.escape(version) + r'[^\n]*\n(.*?)(?=^##\s|\Z)', changelog, re.M | re.S)
          if not match:
              raise SystemExit(f'Notas da versão {version} não encontradas no CHANGELOG.md')
          with open('release-notes.md', 'w', encoding='utf-8') as notes:
              notes.write(match.group(1).strip() + '\n\nPacote Windows x64 verificado pelo GitHub Actions. Os dados do usuário ficam em `%APPDATA%`.')
          PY
      - name: Publicar release para download permanente
        uses: softprops/action-gh-release@v2
        with:
          name: Cobre Server ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/Cobre-Server-*-Windows-x64.zip
            release/Cobre-Server-*-Windows-x64.exe
            release/checksums-sha256.txt
